apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: payments-latency
  namespace: app
spec:
  action: delay
  mode: all
  duration: "6m"
  selector:
    namespaces:
      - app
    labelSelectors:
      app: payments
  delay:
    latency: "600ms"
    jitter: "50ms"
    correlation: "100"