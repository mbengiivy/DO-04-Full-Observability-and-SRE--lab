# Replace YOUR_EMAIL@gmail.com (3 places) with your real address.
# The password is NOT stored here. It is passed on the helm command line.
alertmanager:
  enabled: true
  persistence:
    enabled: false
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "YOUREMAIL@gmail.com"
      smtp_auth_username: "YOUREMAIL@gmail.com"
      smtp_require_tls: true
    route:
      receiver: email-warning
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: email-critical
          repeat_interval: 1h
    inhibit_rules:
      # If a critical alert is firing for an SLO, do not also send its warning
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ["slo"]
    receivers:
      - name: email-warning
        email_configs:
          - to: "YOUREMAIL@gmail.com"
            send_resolved: true
      - name: email-critical
        email_configs:
          - to: "YOUREMAIL@gmail.com"
            send_resolved: true